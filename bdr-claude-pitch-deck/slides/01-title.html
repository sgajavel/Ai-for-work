<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>01 · Title</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..700;1,9..40,300..700&family=Instrument+Serif:ital@0;1&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../shared/tokens.css">
<style>
  body {
    background: var(--chrome-bg);
    color: var(--chrome-ink);
  }

  .title-bg-number {
    position: absolute;
    bottom: -40px;
    right: 80px;
    font-family: var(--font-mono);
    font-size: 520px;
    font-weight: 500;
    line-height: 1;
    color: rgba(255, 255, 255, 0.03);
    user-select: none;
    letter-spacing: -0.02em;
  }

  .title-content {
    position: absolute;
    top: 160px;
    left: 120px;
    right: 120px;
    bottom: 120px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .title-kicker {
    font-family: var(--font-mono);
    font-size: 20px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: rgba(255, 255, 255, 0.45);
    margin-bottom: 48px;
  }

  .title-main {
    max-width: 1300px;
  }

  .title-headline {
    font-family: var(--font-display);
    font-size: 120px;
    line-height: 1.05;
    font-weight: 400;
    color: var(--chrome-ink);
    margin-bottom: 32px;
  }

  .title-headline .accent {
    color: var(--accent);
  }

  .title-subtitle {
    font-family: var(--font-body);
    font-size: 32px;
    font-weight: 300;
    line-height: 1.4;
    color: rgba(255, 255, 255, 0.6);
    max-width: 900px;
  }

  .title-bottom {
    display: flex;
    justify-content: space-between;
    align-items: flex-end;
  }

  .title-meta {
    font-family: var(--font-mono);
    font-size: 18px;
    color: rgba(255, 255, 255, 0.35);
    letter-spacing: 0.08em;
    line-height: 1.8;
  }

  .title-badge {
    display: flex;
    align-items: center;
    gap: 12px;
    font-family: var(--font-body);
    font-size: 24px;
    font-weight: 500;
    color: var(--accent);
  }

  .title-badge-dot {
    width: 10px;
    height: 10px;
    background: var(--accent);
    border-radius: 50%;
  }

  .title-divider {
    width: 80px;
    height: 3px;
    background: var(--accent);
    margin-bottom: 40px;
    opacity: 0.7;
  }
</style>
</head>
<body>

<div class="title-bg-number">2h</div>

<div class="title-content">
  <div>
    <div class="title-kicker">Claude AI for Sales Teams</div>
    <div class="title-divider"></div>
    <div class="title-main">
      <h1 class="title-headline">
        Give Your BDRs<br>
        <span class="accent">2 Extra Hours</span><br>
        Every Day
      </h1>
      <p class="title-subtitle">
        How Claude AI Turns a 40-Person Team Into Your Biggest Revenue Lever
      </p>
    </div>
  </div>

  <div class="title-bottom">
    <div class="title-meta">
      Prepared for VP of Business Development<br>
      IT Research &amp; Advisory Services
    </div>
    <div class="title-badge">
      <span class="title-badge-dot"></span>
      Powered by Claude AI
    </div>
  </div>
</div>

</body>
</html>
